
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBO PAATHSALA - Profile Photo</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:25px 16px;
  font-family:Arial,sans-serif;
  background:#eef4ff;color:#172554;
}
.container{
  max-width:420px;margin:45px auto;
  background:white;padding:25px;
  border-radius:18px;
  box-shadow:0 5px 25px #0001;
}
h2{text-align:center;color:#1746a2}
p{text-align:center;color:#64748b}
input,button{
  width:100%;padding:14px;margin-top:14px;
  border-radius:10px;font-size:15px;
}
input{border:1px solid #cbd5e1}
button{
  border:0;background:#2457d6;
  color:white;font-weight:bold;
}
button:disabled{opacity:.5}
#status{font-size:14px;margin-top:18px;text-align:center}
#uploadArea{display:none}
</style>
</head>
<body>

<div class="container">
  <h2>MBO PAATHSALA</h2>
  <p>Student Profile Photo Upload</p>

  <div id="loginArea">
    <input id="email" type="email" placeholder="Registered email">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn" onclick="login()">Login</button>
  </div>

  <div id="uploadArea">
    <p id="userEmail"></p>
    <input id="photo" type="file" accept="image/jpeg,image/png,image/webp">
    <button id="uploadBtn" onclick="uploadPhoto()">Upload Profile Photo</button>
    <button onclick="logout()" style="background:#64748b">Logout</button>
  </div>

  <div id="status"></div>
</div>

<script>
const FIREBASE_API_KEY = "AIzaSyClQ0FCjtgQ8IxWTwc20vm8yKpoEvyaoW0";

const SUPABASE_URL = "https://ibeoizkeavvzarxtsqzy.supabase.co";
const SUPABASE_KEY = "sb_publishable_xhpGTrnN-DKS6nhXOI8Eyw_hoZM4vOr";

let idToken = "";
let userId = "";

function status(message) {
  document.getElementById("status").textContent = message;
}

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const btn = document.getElementById("loginBtn");

  if (!email || !password) {
    status("Email aur password bharo.");
    return;
  }

  btn.disabled = true;
  status("Logging in...");

  try {
    const response = await fetch(
      "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + FIREBASE_API_KEY,
      {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          email,
          password,
          returnSecureToken: true
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error?.message || "Login failed");
    }

    idToken = data.idToken;
    userId = data.localId;

    document.getElementById("loginArea").style.display = "none";
    document.getElementById("uploadArea").style.display = "block";
    document.getElementById("userEmail").textContent = data.email;

    status("Login successful. Select your photo.");

  } catch (error) {
    status(error.message);
  } finally {
    btn.disabled = false;
  }
}

async function uploadPhoto() {
  const file = document.getElementById("photo").files[0];
  const btn = document.getElementById("uploadBtn");

  if (!file) {
    status("Pehle photo select karo.");
    return;
  }

  if (!["image/jpeg","image/png","image/webp"].includes(file.type)) {
    status("Only JPG, PNG and WEBP allowed.");
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    status("Photo 5 MB se chhoti honi chahiye.");
    return;
  }

  btn.disabled = true;
  status("Uploading photo...");

  try {
    const path = userId + "/profile.jpg";

    const response = await fetch(
      SUPABASE_URL + "/storage/v1/object/Profile-photo/" + path,
      {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: "Bearer " + idToken,
          "Content-Type": file.type,
          "x-upsert": "true"
        },
        body: file
      }
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.message || JSON.stringify(result));
    }

    status("Photo uploaded successfully! Ab app mein Profile kholo.");

  } catch (error) {
    status("Upload failed: " + error.message);
  } finally {
    btn.disabled = false;
  }
}

function logout() {
  idToken = "";
  userId = "";
  document.getElementById("loginArea").style.display = "block";
  document.getElementById("uploadArea").style.display = "none";
  document.getElementById("password").value = "";
  document.getElementById("photo").value = "";
  status("Logged out.");
}
</script>
</body>
</html>
